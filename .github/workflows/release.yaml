# Release: publishes the api image to GHCR for every commit that lands on main.
# PRs never run this workflow, so only merged code is ever published.
name: release

on:
  push:
    branches: [main]

# The GITHUB_TOKEN gets exactly these and nothing else.
permissions:
  contents: read # actions/checkout reads the code
  packages: write # push images to ghcr.io

# Two quick merges: let each release finish rather than cancel one mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Registry paths must be lowercase; this owner name already is.
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Must come before the push: GHCR rejects anonymous pushes.
      # GITHUB_TOKEN is created for this run and expires when it ends; no stored secret.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v7
        with:
          context: . # same build as ci.yaml, so the same image
          file: apps/api/Dockerfile
          push: true
          # SHA: immutable, what ArgoCD deploys. main: moves, for quick manual pulls.
          tags: |
            ${{ env.REGISTRY }}/pulse-api:${{ github.sha }}
            ${{ env.REGISTRY }}/pulse-api:main
          # Links the package to this repo on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Same scopes as ci.yaml: PR builds can reuse caches written on main.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/pulse-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/pulse-worker:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
