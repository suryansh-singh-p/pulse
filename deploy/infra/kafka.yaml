# Kafka for pulse: 1 broker in KRaft mode (no ZooKeeper), with persistent storage.
# The same settings as deploy/compose.yaml, translated to Kubernetes.
# Clients bootstrap from kafka:9092; the broker then tells them to use kafka-0.kafka:9092.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  # Headless: "kafka" resolves to the pod IP, and the pod gets the stable name kafka-0.kafka.
  clusterIP: None
  # Kafka must resolve its own name (kafka-0.kafka) to start, but a headless Service
  # normally publishes a name only once the pod is Ready. Publish it straight away.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka # the headless Service above; gives the pod its DNS name kafka-0.kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Kubernetes normally injects variables like KAFKA_PORT for Services in the namespace.
      # This image turns every KAFKA_* variable into a broker setting, so switch that off.
      enableServiceLinks: false
      # The apache/kafka image runs as appuser (uid 1000); fsGroup lets it write the volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Time for a clean shutdown (Kafka flushes its logs and hands off leadership).
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          env:
            - name: CLUSTER_ID
              value: pulse-local-cluster-01 # fixed, so restarts reuse the data on the volume
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller # one node does both
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-0.kafka:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # The address handed back to clients. It must resolve from every pod in the
            # namespace: the StatefulSet's stable per-pod name. With 3 brokers, each
            # would advertise its own (kafka-0, kafka-1, kafka-2).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-0.kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            # One broker: internal topics can only have one copy (defaults expect 3).
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Topics are created on purpose by the kafka-create-topic Job.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # On the PVC, so topics and committed offsets survive a pod restart.
            # Not /var/lib/kafka/data: the image declares that path as a VOLUME, so the
            # container runtime mounts a fresh, throwaway volume there on top of the PVC,
            # and everything written to it is lost when the container is recreated.
            # A folder the image doesn't declare stays on the PVC.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/logs
            # Heap stays small; the memory limit below is higher because the JVM also
            # uses memory outside the heap. Limit <= heap would get the pod OOMKilled.
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          # A TCP check, not kafka-broker-api-versions.sh: that starts a whole JVM on
          # every probe, which is slow and costs memory. The api's own readiness check
          # does a real Kafka request (describeCluster).
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The PVC root. Kafka writes to the logs/ folder inside it (KAFKA_LOG_DIRS).
            - name: data
              mountPath: /var/lib/kafka
  # One PVC per pod, named data-kafka-0. Survives pod deletion.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
