# Creates the events.raw topic (replaces kafka-init from Compose).
# Under ArgoCD this is a PostSync hook: it runs after every sync, once everything else
# is Healthy. The old Job is deleted first, because a Job can't be edited after it's
# created. Running it again is safe (--if-not-exists).
# Applied by hand with kubectl, the annotations are ignored and it's a normal Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topic
  labels:
    app.kubernetes.io/name: kafka-create-topic
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6 # retries (with growing delay) before the Job is marked Failed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-create-topic
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: kafka-topics
          image: apache/kafka:4.4.0
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xmx128m # the CLI tools are small
            - name: BOOTSTRAP
              value: kafka:9092
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              bin=/opt/kafka/bin
              echo "Waiting for Kafka..."
              for i in $(seq 1 30); do
                if $bin/kafka-broker-api-versions.sh --bootstrap-server "$BOOTSTRAP" >/dev/null 2>&1; then break; fi
                if [ "$i" -eq 30 ]; then echo "Kafka not reachable"; exit 1; fi
                sleep 3
              done
              # 3 partitions = up to 3 workers in one group; 1 broker, so 1 copy.
              $bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --create --if-not-exists \
                --topic events.raw --partitions 3 --replication-factor 1
              $bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --describe --topic events.raw
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
