# One-time Job: creates the pulse-events bucket in MinIO (replaces minio-init from Compose).
# Jobs can't be edited: to change and re-run, `kubectl delete job minio-create-bucket` first.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  labels:
    app.kubernetes.io/name: minio-create-bucket
spec:
  backoffLimit: 6 # retries (with growing delay) before the Job is marked Failed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
            # mc reads alias "local" from this. $(VAR) is filled in by Kubernetes from
            # the variables above, so they must come first. Password must be URL-safe.
            - name: MC_HOST_local
              value: "http://$(MINIO_USER):$(MINIO_PASSWORD)@minio:9000"
            - name: MC_CONFIG_DIR
              value: /tmp/.mc # writable location for mc's config as a non-root user
            - name: BUCKET
              value: pulse-events
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Waiting for MinIO..."
              for i in $(seq 1 30); do
                if mc ls local >/dev/null 2>&1; then break; fi
                if [ "$i" -eq 30 ]; then echo "MinIO not reachable"; exit 1; fi
                sleep 2
              done
              mc mb --ignore-existing "local/${BUCKET}"
              echo "Buckets:"
              mc ls local
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
