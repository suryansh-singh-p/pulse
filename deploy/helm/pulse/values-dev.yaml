# Overrides for the local kind cluster. Only what differs from values.yaml.
# Deployed by ArgoCD (deploy/argocd/application.yaml) from main: change this file
# through a PR, never with helm or kubectl.
# Needs the Secret pulse-s3 in namespace pulse (created by hand, never in Git):
#   kubectl create secret generic pulse-s3 -n pulse \
#     --from-literal=AWS_ACCESS_KEY_ID=<minio user> --from-literal=AWS_SECRET_ACCESS_KEY=<minio password>

image:
  repository: ghcr.io/suryansh-singh-p/pulse-api
  # Commit SHA built by release.yaml. Deploy = change this; rollback = git revert.
  tag: 0f5c4491cbbb34867bae323e6065cc258385aec1
  # The SHA tag never changes, so pulling once per node is enough.
  pullPolicy: IfNotPresent

s3:
  existingSecret: pulse-s3

# Smaller footprint: the whole cluster runs on one laptop.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi

env:
  LOG_LEVEL: debug

# Off so Git owns the replica count (replicaCount in values.yaml) for the GitOps drills.
autoscaling:
  enabled: false

pdb:
  enabled: true

worker:
  # Off until image.tag points at a commit that has a pulse-worker image
  # (the worker image was first built with PR #6). Switched on with the tag bump.
  enabled: true
  replicaCount: 2 # 3 partitions split 2 + 1 between the two workers
  image:
    repository: ghcr.io/suryansh-singh-p/pulse-worker
  env:
    FLUSH_INTERVAL_MS: "10000" # files appear in MinIO within 10 s: easier to show
