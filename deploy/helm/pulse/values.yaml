# Default values for the pulse chart (api, and the worker when worker.enabled).
# Environment files (e.g. values-dev.yaml) override only what differs.

replicaCount: 2 # ignored when autoscaling.enabled is true (the HPA owns replicas)

image:
  repository: pulse-api
  # IfNotPresent: use the image already on the node (loaded with `kind load`).
  pullPolicy: IfNotPresent
  # Empty = use appVersion from Chart.yaml.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# Pod-level security. runAsUser matches USER 1000 in the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80 # what clients use: http://pulse:80
  targetPort: 3000 # what the container listens on (the app's PORT)

resources:
  requests:
    cpu: 100m # the HPA's 70% target is measured against this
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Liveness failure restarts the container, so it is more forgiving than readiness.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# Readiness failure only removes the pod from the Service.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# Must be longer than the app's own 10 s shutdown timeout.
terminationGracePeriodSeconds: 30

# Non-secret settings, rendered into the ConfigMap. Names match what the apps read.
# Shared by the api and the worker.
env:
  PORT: "3000"
  KAFKA_BROKERS: kafka:9092
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: pulse-events
  AWS_REGION: us-east-1 # the S3 SDK requires a region; MinIO ignores it
  LOG_LEVEL: info

# S3 credentials. Two ways to provide them; never commit real values:
# 1. existingSecret: name of a Secret created outside the chart, with keys
#    AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. The chart then renders no Secret.
#    Used with ArgoCD, which only sees Git and so can't get --set values.
# 2. Leave existingSecret empty and pass --set s3.accessKey=... --set s3.secretKey=...
s3:
  existingSecret: ""
  accessKey: ""
  secretKey: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

# The worker: a second Deployment from the same chart, using the same ConfigMap and Secret.
worker:
  enabled: false
  replicaCount: 1 # at most 3, the number of partitions of events.raw
  image:
    repository: pulse-worker
    tag: "" # empty = same tag as the api (image.tag): one release, one commit
  # Longer than the worker's own 20 s shutdown timeout.
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Worker-only environment variables (the code has defaults: BATCH_SIZE 500,
  # FLUSH_INTERVAL_MS 30000).
  env: {}

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
