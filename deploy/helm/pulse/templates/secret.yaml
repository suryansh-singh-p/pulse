{{- /* Skipped when s3.existingSecret names a Secret created outside the chart. */ -}}
{{- if not .Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.s3SecretName" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
# stringData takes plain text; the API server stores it base64-encoded.
# Key names are the standard AWS SDK variables.
stringData:
  AWS_ACCESS_KEY_ID: {{ required "set s3.accessKey (e.g. --set s3.accessKey=...) or s3.existingSecret" .Values.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "set s3.secretKey (e.g. --set s3.secretKey=...) or s3.existingSecret" .Values.s3.secretKey | quote }}
{{- end }}
