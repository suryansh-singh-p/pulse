apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.fullname" . }}-s3
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
# stringData takes plain text; the API server stores it base64-encoded.
# Key names are the standard AWS SDK variables.
stringData:
  AWS_ACCESS_KEY_ID: {{ required "set s3.accessKey (e.g. --set s3.accessKey=...)" .Values.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "set s3.secretKey (e.g. --set s3.secretKey=...)" .Values.s3.secretKey | quote }}
