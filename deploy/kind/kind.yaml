# Local cluster for pulse: 1 control-plane + 2 workers.
# Create: kind create cluster --config deploy/kind/kind.yaml
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: pulse
nodes:
  - role: control-plane
  - role: worker
  - role: worker
# To pin the Kubernetes version, add `image: kindest/node:<version>@sha256:<digest>`
# to each node, using an image listed in the release notes for your kind version.
